services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ordersync
      POSTGRES_PASSWORD: ordersync
      POSTGRES_DB: ordersync
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordersync -d ordersync"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["/app/api"]
    environment: &app_env
      APP_ENV: development
      HTTP_ADDR: ":8080"
      API_KEY: dev-local-key
      POSTGRES_DSN: postgres://ordersync:ordersync@postgres:5432/ordersync?sslmode=disable
      REDIS_ADDR: redis:6379
      MIGRATIONS_PATH: /app/migrations/001_init.sql
      MAX_CONCURRENCY: "8"
      BATCH_MIN: "5"
      BATCH_SOFT_LIMIT: "40"
      BATCH_MAX: "100"
      WB_LIKE_RPS: "5"
      OZON_LIKE_RPS: "8"
      MOCK_FAIL_PCT: "0.05"
      ENABLE_PPROF: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["/app/worker"]
    environment:
      <<: *app_env
      WORKER_METRICS_ADDR: ":8081"
      WORKER_ID: worker-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-2:
    build: .
    command: ["/app/worker"]
    profiles: ["multi"]
    environment:
      <<: *app_env
      WORKER_METRICS_ADDR: ":8081"
      WORKER_ID: worker-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker

volumes:
  pgdata:
