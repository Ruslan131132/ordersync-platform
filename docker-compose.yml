# Local demo stack. Every credential below is a throwaway value for this
# compose network only; override via environment or a .env file.
name: ordersync

x-app-env: &app-env
  APP_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_KEY: ${API_KEY:-dev-local-key}
  POSTGRES_DSN: postgres://ordersync:ordersync@postgres:5432/ordersync?sslmode=disable
  REDIS_ADDR: redis:6379
  ENABLE_PPROF: ${ENABLE_PPROF:-true}
  MARKET_BASE_URL: http://api:8080/mock/marketplaces
  WB_LIKE_TOKEN: ${WB_LIKE_TOKEN:-demo-wb-token}
  OZON_LIKE_TOKEN: ${OZON_LIKE_TOKEN:-demo-ozon-token}
  WB_LIKE_RPS: ${WB_LIKE_RPS:-20}
  OZON_LIKE_RPS: ${OZON_LIKE_RPS:-30}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ordersync
      POSTGRES_PASSWORD: ordersync
      POSTGRES_DB: ordersync
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordersync -d ordersync"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    entrypoint: ["/app/api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      MOCK_MARKET_ENABLED: "true"
      MOCK_FAIL_RATE: ${MOCK_FAIL_RATE:-0.05}
      MOCK_LATENCY: ${MOCK_LATENCY:-25ms}
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scale with: docker compose up -d --scale worker=2 (see `make up-multi`).
  # WORKER_ID defaults to the container hostname, so replicas stay distinct.
  worker:
    build: .
    entrypoint: ["/app/worker"]
    environment:
      <<: *app-env
      METRICS_ADDR: ":8081"
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-16}
      SHUTDOWN_GRACE: 20s
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
