global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  # DNS discovery resolves every replica of the compose `worker` service,
  # so `--scale worker=N` is picked up without editing this file.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8081
        refresh_interval: 10s
