name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: tidy
        run: go mod tidy
      - name: test
        run: go test ./... -count=1
      - name: lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          args: ./...
